<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveSubs Admin - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-[#0a0a14] text-gray-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API = {
  getMetrics: () => fetch('/api/admin/metrics').then(r => r.json()),
  getGlossary: () => fetch('/api/admin/glossary').then(r => r.json()),
  addTerm: (original, translation) => fetch('/api/admin/glossary', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({original, translation}) }).then(r => r.json()),
  updateTerm: (original, translation) => fetch('/api/admin/glossary', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({original, translation}) }).then(r => r.json()),
  deleteTerm: (original) => fetch('/api/admin/glossary', { method: 'DELETE', headers: {'Content-Type':'application/json'}, body: JSON.stringify({original}) }).then(r => r.json()),
  pauseRoom: (room) => fetch(`/api/rooms/${room}/pause`, { method: 'POST' }).then(r => r.json()),
  resumeRoom: (room) => fetch(`/api/rooms/${room}/resume`, { method: 'POST' }).then(r => r.json()),
  clearRoom: (room) => fetch(`/api/rooms/${room}/clear`, { method: 'POST' }).then(r => r.json()),
};

const Icon = ({ name, className = "w-5 h-5" }) => {
  const icons = {
    dashboard: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>,
    book: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
    activity: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
    pause: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
    play: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
    trash: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
    plus: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    back: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
    users: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
    clock: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  };
  return icons[name] || null;
};

const StatusBadge = ({ status }) => {
  const styles = {
    active: 'bg-green-500/20 text-green-400 border-green-500/30',
    paused: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
    error: 'bg-red-500/20 text-red-400 border-red-500/30',
  };
  return (
    <span className={`px-2 py-0.5 rounded-full text-xs font-medium border ${styles[status] || styles.active}`}>
      {status}
    </span>
  );
};

const MetricCard = ({ room, onPause, onResume, onClear }) => {
  return (
    <div className="bg-[#11111e] border border-gray-800/50 rounded-xl p-4 fade-in">
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-semibold text-gray-200 capitalize">{room.room_id.replace('-', ' ')}</h3>
        <StatusBadge status={room.status} />
      </div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div className="bg-[#0a0a14] rounded-lg p-2">
          <p className="text-xs text-gray-500 mb-1">Whisper</p>
          <p className="text-lg font-bold text-indigo-400">{room.last_whisper_ms}<span className="text-xs text-gray-600">ms</span></p>
          <p className="text-xs text-gray-600">avg {room.avg_whisper_ms}ms</p>
        </div>
        <div className="bg-[#0a0a14] rounded-lg p-2">
          <p className="text-xs text-gray-500 mb-1">Gemma</p>
          <p className="text-lg font-bold text-purple-400">{room.last_gemma_ms}<span className="text-xs text-gray-600">ms</span></p>
          <p className="text-xs text-gray-600">avg {room.avg_gemma_ms}ms</p>
        </div>
      </div>
      <div className="flex items-center justify-between text-xs text-gray-500 mb-3">
        <span className="flex items-center gap-1"><Icon name="users" className="w-3 h-3" /> {room.listeners}</span>
        <span className="flex items-center gap-1"><Icon name="activity" className="w-3 h-3" /> {room.total_subtitles} subs</span>
      </div>
      <div className="flex gap-2">
        {room.status === 'active' ? (
          <button onClick={() => onPause(room.room_id)} className="flex-1 flex items-center justify-center gap-1 bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-400 text-xs py-1.5 rounded-lg transition-all">
            <Icon name="pause" className="w-3 h-3" /> Pausar
          </button>
        ) : (
          <button onClick={() => onResume(room.room_id)} className="flex-1 flex items-center justify-center gap-1 bg-green-500/10 hover:bg-green-500/20 text-green-400 text-xs py-1.5 rounded-lg transition-all">
            <Icon name="play" className="w-3 h-3" /> Reanudar
          </button>
        )}
        <button onClick={() => onClear(room.room_id)} className="flex-1 flex items-center justify-center gap-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs py-1.5 rounded-lg transition-all">
          <Icon name="trash" className="w-3 h-3" /> Limpiar
        </button>
      </div>
      {room.last_error && (
        <p className="text-xs text-red-400/70 mt-2 truncate">⚠ {room.last_error}</p>
      )}
    </div>
  );
};

const SystemMetrics = ({ sys }) => {
  const formatUptime = (s) => {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return `${h}h ${m}m`;
  };
  return (
    <div className="grid grid-cols-3 gap-3">
      <div className="bg-[#11111e] border border-gray-800/50 rounded-xl p-3">
        <div className="flex items-center gap-2 text-gray-500 text-xs mb-1"><Icon name="clock" className="w-3 h-3" /> Uptime</div>
        <p className="text-lg font-bold text-gray-200">{formatUptime(sys.uptime_seconds)}</p>
      </div>
      <div className="bg-[#11111e] border border-gray-800/50 rounded-xl p-3">
        <div className="flex items-center gap-2 text-gray-500 text-xs mb-1"><Icon name="activity" className="w-3 h-3" /> Errores</div>
        <p className="text-lg font-bold text-gray-200">{sys.total_errors}</p>
      </div>
      <div className="bg-[#11111e] border border-gray-800/50 rounded-xl p-3">
        <div className="flex items-center gap-2 text-gray-500 text-xs mb-1"><Icon name="dashboard" className="w-3 h-3" /> Salas</div>
        <p className="text-lg font-bold text-gray-200">{sys.total_rooms}</p>
      </div>
    </div>
  );
};

const GlossaryManager = () => {
  const [terms, setTerms] = useState({});
  const [newOriginal, setNewOriginal] = useState('');
  const [newTranslation, setNewTranslation] = useState('');
  const [editing, setEditing] = useState(null);

  const load = useCallback(() => {
    API.getGlossary().then(data => setTerms(data.terms || {}));
  }, []);

  useEffect(() => { load(); }, [load]);

  const handleAdd = async () => {
    if (!newOriginal.trim() || !newTranslation.trim()) return;
    await API.addTerm(newOriginal.trim(), newTranslation.trim());
    setNewOriginal('');
    setNewTranslation('');
    load();
  };

  const handleDelete = async (original) => {
    await API.deleteTerm(original);
    load();
  };

  const handleUpdate = async (original, translation) => {
    await API.updateTerm(original, translation);
    setEditing(null);
    load();
  };

  const termEntries = Object.entries(terms);

  return (
    <div className="bg-[#11111e] border border-gray-800/50 rounded-xl p-4">
      <div className="flex items-center gap-2 mb-4">
        <Icon name="book" className="w-5 h-5 text-indigo-400" />
        <h2 className="text-sm font-semibold text-gray-200">Glosario Técnico</h2>
        <span className="text-xs text-gray-600">{termEntries.length} términos</span>
      </div>

      {/* Add new term */}
      <div className="flex gap-2 mb-4">
        <input
          type="text"
          placeholder="Término original"
          value={newOriginal}
          onChange={e => setNewOriginal(e.target.value)}
          className="flex-1 bg-[#0a0a14] text-gray-200 px-3 py-2 rounded-lg border border-gray-700 focus:border-indigo-500 outline-none text-sm"
        />
        <input
          type="text"
          placeholder="Traducción"
          value={newTranslation}
          onChange={e => setNewTranslation(e.target.value)}
          className="flex-1 bg-[#0a0a14] text-gray-200 px-3 py-2 rounded-lg border border-gray-700 focus:border-indigo-500 outline-none text-sm"
        />
        <button
          onClick={handleAdd}
          className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm transition-all"
        >
          <Icon name="plus" className="w-4 h-4" />
        </button>
      </div>

      {/* Terms list */}
      <div className="space-y-1 max-h-64 overflow-y-auto">
        {termEntries.length === 0 ? (
          <p className="text-gray-600 text-sm text-center py-4">No hay términos en el glosario</p>
        ) : (
          termEntries.map(([original, translation]) => (
            <div key={original} className="flex items-center gap-2 bg-[#0a0a14] rounded-lg px-3 py-2 group hover:bg-[#15152a] transition-colors">
              {editing === original ? (
                <>
                  <input
                    type="text"
                    defaultValue={translation}
                    id={`edit-${original}`}
                    className="flex-1 bg-[#1a1a2e] text-gray-200 px-2 py-1 rounded border border-indigo-500 outline-none text-sm"
                  />
                  <button
                    onClick={() => handleUpdate(original, document.getElementById(`edit-${original}`).value)}
                    className="text-green-400 hover:text-green-300 text-xs px-2"
                  >OK</button>
                  <button
                    onClick={() => setEditing(null)}
                    className="text-gray-500 hover:text-gray-400 text-xs px-2"
                  >✕</button>
                </>
              ) : (
                <>
                  <span className="text-gray-400 text-sm flex-1">{original}</span>
                  <span className="text-gray-600">→</span>
                  <span className="text-gray-200 text-sm flex-1">{translation}</span>
                  <button
                    onClick={() => setEditing(original)}
                    className="text-gray-500 hover:text-indigo-400 text-xs opacity-0 group-hover:opacity-100 transition-opacity"
                  >editar</button>
                  <button
                    onClick={() => handleDelete(original)}
                    className="text-gray-500 hover:text-red-400 text-xs opacity-0 group-hover:opacity-100 transition-opacity"
                  >
                    <Icon name="trash" className="w-3.5 h-3.5" />
                  </button>
                </>
              )}
            </div>
          ))
        )}
      </div>
    </div>
  );
};

const App = () => {
  const [metrics, setMetrics] = useState({ rooms: [], system: {} });
  const [connected, setConnected] = useState(false);
  const wsRef = useRef(null);

  useEffect(() => {
    const ws = new WebSocket(`ws://${window.location.host}/ws/admin`);
    wsRef.current = ws;
    ws.onopen = () => setConnected(true);
    ws.onclose = () => setConnected(false);
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'metrics') {
        setMetrics({ rooms: data.rooms, system: data.system });
      }
    };
    // Also fetch once immediately
    API.getMetrics().then(data => setMetrics({ rooms: data.rooms, system: data.system }));

    return () => ws.close();
  }, []);

  const handlePause = async (room) => { await API.pauseRoom(room); };
  const handleResume = async (room) => { await API.resumeRoom(room); };
  const handleClear = async (room) => { await API.clearRoom(room); };

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <header className="bg-[#0d0d1a] border-b border-gray-800/50 px-6 py-4">
        <div className="flex items-center justify-between max-w-6xl mx-auto">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center">
              <Icon name="dashboard" className="w-5 h-5 text-white" />
            </div>
            <div>
              <h1 className="text-xl font-bold text-white">LiveSubs Admin</h1>
              <p className="text-xs text-gray-500">Dashboard de producción · Nerdearla</p>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <div className={`flex items-center gap-2 text-xs ${connected ? 'text-green-400' : 'text-gray-500'}`}>
              <div className={`w-2 h-2 rounded-full ${connected ? 'bg-green-400 pulse-dot' : 'bg-gray-600'}`}></div>
              {connected ? 'Conectado' : 'Desconectado'}
            </div>
            <a href="/" className="flex items-center gap-1 text-gray-400 hover:text-gray-200 transition-colors text-sm">
              <Icon name="back" className="w-4 h-4" />
              Cliente
            </a>
          </div>
        </div>
      </header>

      <main className="flex-1 max-w-6xl mx-auto w-full px-6 py-6 space-y-6">
        {/* System Metrics */}
        <section>
          <h2 className="text-xs text-gray-500 uppercase tracking-wider mb-3">Sistema</h2>
          <SystemMetrics sys={metrics.system} />
        </section>

        {/* Room Metrics */}
        <section>
          <h2 className="text-xs text-gray-500 uppercase tracking-wider mb-3">Salas</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {metrics.rooms.map(room => (
              <MetricCard
                key={room.room_id}
                room={room}
                onPause={handlePause}
                onResume={handleResume}
                onClear={handleClear}
              />
            ))}
          </div>
        </section>

        {/* Glossary */}
        <section>
          <h2 className="text-xs text-gray-500 uppercase tracking-wider mb-3">Configuración</h2>
          <GlossaryManager />
        </section>
      </main>

      <footer className="bg-[#0d0d1a] border-t border-gray-800/50 px-6 py-3 text-center">
        <p className="text-xs text-gray-600">
          LiveSubs Admin · Whisper + Gemma 2B · 100% local
        </p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
