<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveSubs - Subtítulos en vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 3px; }
    .subtitle-enter { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body class="bg-[#0a0a14] text-gray-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

const API = {
  getRooms: () => fetch('/api/rooms').then(r => r.json()),
  exportSubs: (room, fmt) => fetch(`/api/rooms/${room}/export?format=${fmt}`).then(r => r.text()),
  getSubtitles: (room) => fetch(`/api/rooms/${room}/subtitles`).then(r => r.json()),
};

const Icon = ({ name, className = "w-5 h-5" }) => {
  const icons = {
    mic: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>,
    download: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    globe: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
    radio: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48 0a6 6 0 0 1 0-8.49m11.31-2.83a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>,
    settings: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
  };
  return icons[name] || null;
};

const RoomSelector = ({ rooms, selected, onSelect }) => (
  <div className="flex flex-wrap gap-2">
    {rooms.map(room => (
      <button
        key={room}
        onClick={() => onSelect(room)}
        className={`px-4 py-2 rounded-lg font-medium transition-all capitalize ${
          selected === room
            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
            : 'bg-[#1a1a2e] text-gray-400 hover:bg-[#252540] hover:text-gray-200'
        }`}
      >
        {room.replace('-', ' ')}
      </button>
    ))}
  </div>
);

const LangSelector = ({ value, onChange }) => {
  const langs = [
    { code: 'original', label: 'Original' },
    { code: 'es', label: 'Español' },
    { code: 'en', label: 'English' },
    { code: 'pt', label: 'Português' },
  ];
  return (
    <select
      value={value}
      onChange={e => onChange(e.target.value)}
      className="bg-[#1a1a2e] text-gray-200 px-3 py-2 rounded-lg border border-gray-700 focus:border-indigo-500 outline-none"
    >
      {langs.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
    </select>
  );
};

const ExportButton = ({ room }) => {
  const [open, setOpen] = useState(false);
  const download = async (fmt) => {
    const content = await API.exportSubs(room, fmt);
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${room}.${fmt}`;
    a.click();
    URL.revokeObjectURL(url);
    setOpen(false);
  };
  return (
    <div className="relative">
      <button
        onClick={() => setOpen(!open)}
        className="flex items-center gap-2 bg-[#1a1a2e] hover:bg-[#252540] px-3 py-2 rounded-lg text-gray-300 transition-all"
      >
        <Icon name="download" className="w-4 h-4" />
        <span className="text-sm">Exportar</span>
      </button>
      {open && (
        <div className="absolute right-0 mt-2 bg-[#1a1a2e] border border-gray-700 rounded-lg shadow-xl z-50 min-w-[120px]">
          {['srt', 'vtt', 'txt'].map(fmt => (
            <button
              key={fmt}
              onClick={() => download(fmt)}
              className="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-indigo-600/20 uppercase first:rounded-t-lg last:rounded-b-lg"
            >
              .{fmt}
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

const SubtitleDisplay = ({ subtitles, lang }) => {
  const containerRef = useRef(null);
  useEffect(() => {
    if (containerRef.current) {
      containerRef.current.scrollTop = containerRef.current.scrollHeight;
    }
  }, [subtitles]);

  const formatTime = (ts) => {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  };

  if (subtitles.length === 0) {
    return (
      <div ref={containerRef} className="flex-1 flex items-center justify-center text-gray-600 text-sm">
        <div className="text-center">
          <Icon name="radio" className="w-12 h-12 mx-auto mb-3 opacity-30" />
          <p>Esperando subtítulos...</p>
          <p className="text-xs mt-1">Conectado a la sala</p>
        </div>
      </div>
    );
  }

  return (
    <div ref={containerRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
      {subtitles.map((s, i) => {
        const showOriginal = lang === 'original' || lang === 'en';
        const showTranslated = lang !== 'original' && s.translated;
        const isLatest = i === subtitles.length - 1;
        return (
          <div key={s.index || i} className={`subtitle-enter ${isLatest ? 'border-l-2 border-indigo-500 pl-3' : 'pl-4'}`}>
            <div className="flex items-center gap-2 text-xs text-gray-500 mb-1">
              <span className="font-mono">{formatTime(s.timestamp)}</span>
              {s.whisper_ms && (
                <span className="text-gray-600">· {s.whisper_ms}ms</span>
              )}
            </div>
            {showOriginal && (
              <p className="text-gray-400 text-sm leading-relaxed">{s.original}</p>
            )}
            {showTranslated && (
              <p className="text-gray-100 text-base leading-relaxed font-medium">{s.translated}</p>
            )}
          </div>
        );
      })}
    </div>
  );
};

const App = () => {
  const [rooms, setRooms] = useState([]);
  const [selectedRoom, setSelectedRoom] = useState('');
  const [lang, setLang] = useState('es');
  const [subtitles, setSubtitles] = useState([]);
  const [connected, setConnected] = useState(false);
  const wsRef = useRef(null);

  useEffect(() => {
    API.getRooms().then(data => {
      setRooms(data.rooms);
      if (data.rooms.length > 0) setSelectedRoom(data.rooms[0]);
    });
  }, []);

  useEffect(() => {
    if (!selectedRoom) return;
    if (wsRef.current) wsRef.current.close();

    setSubtitles([]);
    const wsUrl = `ws://${window.location.host}/ws/${selectedRoom}`;
    const ws = new WebSocket(wsUrl);
    wsRef.current = ws;

    ws.onopen = () => setConnected(true);
    ws.onclose = () => setConnected(false);
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      setSubtitles(prev => [...prev.slice(-99), data]);
    };

    return () => ws.close();
  }, [selectedRoom]);

  return (
    <div className="min-h-screen flex flex-col">
      <header className="bg-[#0d0d1a] border-b border-gray-800/50 px-6 py-4">
        <div className="flex items-center justify-between max-w-5xl mx-auto">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center">
              <Icon name="mic" className="w-5 h-5 text-white" />
            </div>
            <div>
              <h1 className="text-xl font-bold text-white">LiveSubs</h1>
              <p className="text-xs text-gray-500">Subtítulos en vivo · Nerdearla</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className={`flex items-center gap-2 text-xs ${connected ? 'text-green-400' : 'text-gray-500'}`}>
              <div className={`w-2 h-2 rounded-full ${connected ? 'bg-green-400 pulse-dot' : 'bg-gray-600'}`}></div>
              {connected ? 'En vivo' : 'Desconectado'}
            </div>
            <a href="/admin" className="text-gray-400 hover:text-gray-200 transition-colors">
              <Icon name="settings" className="w-5 h-5" />
            </a>
          </div>
        </div>
      </header>

      <div className="bg-[#0d0d1a] border-b border-gray-800/50 px-6 py-4">
        <div className="max-w-5xl mx-auto flex flex-wrap items-center gap-4 justify-between">
          <div className="flex flex-wrap items-center gap-3">
            <span className="text-xs text-gray-500 uppercase tracking-wider">Sala</span>
            <RoomSelector rooms={rooms} selected={selectedRoom} onSelect={setSelectedRoom} />
          </div>
          <div className="flex items-center gap-3">
            <div className="flex items-center gap-2">
              <Icon name="globe" className="w-4 h-4 text-gray-500" />
              <LangSelector value={lang} onChange={setLang} />
            </div>
            {selectedRoom && <ExportButton room={selectedRoom} />}
          </div>
        </div>
      </div>

      <main className="flex-1 max-w-5xl mx-auto w-full px-6 py-4 flex flex-col">
        <div className="bg-[#11111e] border border-gray-800/50 rounded-2xl flex flex-col h-[calc(100vh-220px)] min-h-[400px]">
          <div className="px-4 py-3 border-b border-gray-800/50 flex items-center justify-between">
            <h2 className="text-sm font-medium text-gray-300 capitalize">
              {selectedRoom ? selectedRoom.replace('-', ' ') : 'Selecciona una sala'}
            </h2>
            <span className="text-xs text-gray-600">{subtitles.length} subtítulos</span>
          </div>
          <SubtitleDisplay subtitles={subtitles} lang={lang} />
        </div>
      </main>

      <footer className="bg-[#0d0d1a] border-t border-gray-800/50 px-6 py-3 text-center">
        <p className="text-xs text-gray-600">
          Whisper + Gemma 2B · 100% local · Powered by open source
        </p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
